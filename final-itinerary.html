al-item"><span>점심</span><strong>쿠루미 신사이바시 본점 (와규 야키니쿠·우설·하라미)</strong></div>\n<div class="meal-item"><span>저녁</span><strong>KIX 공항 (공항 내 식당)</strong></div>');const fixes={"레노아 향기비즈 / 섬유유연제":"https://item-shopping.c.yimg.jp/i/n/e-hiso_4902430860147","KAI 세키마고로쿠 손톱깎이":"https://i.ebayimg.com/images/g/zvMAAOSwjFtm643r/s-l500.png","GATSBY 바디페이퍼":"https://todokujapan-world.com/cdn/shop/files/100_500x_f03293b5-9569-48ff-89d6-57558c6057ec.webp?v=1698386986&width=2048"};document.open();document.write(text);document.close();const apply=()=>{document.querySelectorAll('#donki .shop-card').forEach(card=>{const h=card.querySelector('h3'),img=card.querySelector('.shop-img img');if(!h||!img)return;const url=fixes[h.textContent.trim()];if(url){img.src=url;img.referrerPolicy='no-referrer';img.loading='eager';img.onerror=()=>{img.style.display='none';const b=img.parentElement;b.classList.add('fallback');b.textContent='🛍️'}}})};setTimeout(apply,30);setTimeout(apply,350)}catch(e){document.body.innerHTML='<div class="loading"><div class="box">일정을 불러오지 못했어요. 새로고침해주세요.</div></div>'}})();</script></body></html>
