name: Build Donki product assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download product images
        shell: bash
        run: |
          set -u
          mkdir -p assets/donki/products
          rm -f assets/donki/products/*
          : > assets/donki/products/FAILED.txt

          grab() {
            out="$1"; shift
            for url in "$@"; do
              echo "Trying $out <- $url"
              if curl -fL --retry 2 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' -e 'https://www.google.com/' "$url" -o "assets/donki/products/$out"; then
                if [ -s "assets/donki/products/$out" ]; then
                  echo "OK $out"
                  return 0
                fi
              fi
              rm -f "assets/donki/products/$out"
            done
            echo "$out" >> assets/donki/products/FAILED.txt
            echo "FAILED $out"
            return 0
          }

          grab 01-ohta.png 'https://bluebox007.wisacdn.com/_data/attach/202504/15/7b66561d0d5df4054b395ed1de426124.png'
          grab 02-cabagin.png 'https://www.kowakorea.com/upload/goods/img1/20240321225133_3602.png' 'https://youyoutime.jp/images/articles/big20260202cvnknl130213525112.jpg'
          grab 03-wakamoto.jpg 'https://www.mtdrug.co.jp/upload/product/291-HDD.jpg' 'https://malljapan.net/data/mall/14/1/1369620260108175408.thumb.jpg'
          grab 04-ryukakusan.jpg 'https://www.jhceshop.com/media/catalog/product/cache/5809d3fcace43b61578d548721d241da/P/G/PG320_210535_D_01_4987240210535_5.jpg' 'https://before-images-item.croketglobal.net/item/thumbnail/65dd0b328262b3318303d987780b83f3.webp'
          grab 05-roihi.jpg 'https://oishiijapanstore.com/cdn/shop/files/8EB261C4-8A9F-4CA6-8DB0-A01967E8D8C4.jpg?v=1771429095&width=1445' 'https://hanamarumart.us/cdn/shop/files/Screenshot2024-03-14at9.22.37PM.png?v=1710465804'
          grab 06-salonpas.png 'https://global-satudora.com/cdn/shop/files/4987188100325-3_e208acd2-7d16-407b-b867-a62d1ee5d14f.png?v=1736312729&width=1200' 'https://img.danawa.com/prod_img/500000/241/226/img/36226241_1.jpg?_v=20251017045335'
          grab 07-pair.jpg 'https://namba.com.mx/cdn/shop/files/CAA14P.jpg?v=1766202354&width=416' 'https://www.everydayemall.com/cdn/shop/products/image__70308_480x.png?v=1619729975'
          grab 08-oronine.jpg 'https://img06.weeecdn.com/description/image/682/524/2DF6B93CEF8DD48E.jpeg' 'https://img06.weeecdn.com/item/image/699/048/46EA00EEE6380F8A.jpeg%21c750x0.jpeg'
          grab 09-alinamin.jpg 'https://d2l91jtvo396gr.cloudfront.net/item/38/38540/1.jpg' 'https://ebisujapan.com/cdn/shop/files/4987123145404_01_b187848f42976f3232671bee0a826419_1_1024x1024%402x.jpg?v=1723088058'
          grab 10-qp.jpg 'https://ecimg.cafe24img.com/pg954b87808485072/umcjapan032701/web/product/big/shop1_30aae24af533136c9b47471a3d03f7c9.jpg'
          grab 11-kitkat.webp 'https://www.nestle.jp/sites/g/files/pydnoa331/files/styles/webp_image/public/2024-09/kitkat-matcha-green-tea-product.png.webp'
          grab 12-alfort.jpg 'https://www.bourbon.co.jp/product_file/file/%E3%82%A2%E3%83%AB%E3%83%95%E3%82%A9%E3%83%BC%E3%83%88%E3%83%9F%E3%83%8B%E3%83%81%E3%83%A7%E3%82%B3%E3%83%AC%E3%83%BC%E3%83%88%E6%96%9C.jpg'
          grab 13-orihiro.jpg 'https://image.auction.co.kr/origin/55/7a/97/557a977196.jpg'
