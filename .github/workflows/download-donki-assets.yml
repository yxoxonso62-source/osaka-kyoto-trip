name: Build Donki product assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download six missing product images
        shell: bash
        run: |
          set -u
          mkdir -p assets/donki/products
          : > assets/donki/products/FAILED.txt

          grab() {
            out="$1"; shift
            rm -f "assets/donki/products/$out"
            for url in "$@"; do
              echo "Trying $out <- $url"
              if curl -fL --retry 2 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' -e 'https://www.google.com/' "$url" -o "assets/donki/products/$out"; then
                if [ -s "assets/donki/products/$out" ]; then
                  echo "OK $out"
                  return 0
                fi
              fi
              rm -f "assets/donki/products/$out"
            done
            echo "$out" >> assets/donki/products/FAILED.txt
            echo "FAILED $out"
            return 0
          }

          grab 11-kitkat.webp 'https://p19-oec-general-useast8.ttcdn-us.com/tos-useast8-i-rt0ujvrtvp-tx2/8edbd86046f94ff98beeae4c35b01a4b~tplv-fhlh96nyum-resize-webp%3A800%3A800.webp?dr=12190&from=2378011839&idc=useast5&ps=933b5bde&shcp=948674b7&shp=8dbd94bf&t=555f072d'
          grab 15-kakinotane.jpg 'https://thumbnail.coupangcdn.com/thumbnails/remote/492x492ex/image/vendor_inventory/0437/51e135cba214de71c9c12ed5d43d94065b0fe645024a6dca3043a1f3758f.jpg'
          grab 19-shiroi.jpg 'https://cdn.store-assets.com/s/982339/i/61220021.jpg?width=1024'
          grab 20-jagabee.jpg 'https://greenbeans.com/images-v3/89edeb69-fe10-49ca-baab-5c51900239b9/402a39cd-2b82-448a-9ca6-517e2ff384e4/500x500.jpg'
          grab 26-fino.jpg 'https://www.tsemporium.com/media/catalog/product/4/9/4901872837144_a.jpg'
          grab 27-bathball.jpg 'https://cdn.askul.co.jp/img/product/3L1/U255089_3L1.jpg' 'https://r.r10s.jp/ran/img/1001/0004/525/636/250/477/10010004525636250477_1.jpg'

          echo '--- Failed files ---'
          cat assets/donki/products/FAILED.txt

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/donki/products
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'Complete Donki product image assets'
            git push origin HEAD:main
          fi
