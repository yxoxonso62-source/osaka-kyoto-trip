          grab 19-shiroi.jpg 'https://japaninabox.jp/cdn/shop/files/shiroi-koibito-24-pieces-white-chocolate.jpg'
          grab 20-jagabee.jpg 'https://snackbar.mogushop.asia/cdn/shop/products/B093543_3292x.jpg?v=1637056173'
          grab 21-kororo.jpg 'https://i5.walmartimages.com/seo/Japanese-UHA-Kororo-Gummy-Candy-Grape-Flavor-40g-Pack-of-6_afd8e9e5-7bd2-4059-b1f5-b18345dd8bfe.6dd44a0a842bf51c11fc2bcfa1e144ed.jpeg'
          grab 22-pocky.jpg 'https://contents.lotteon.com/itemimage/20251112075520/LO/24/31/49/27/12/_2/43/14/92/71/3/LO2431492712_2431492713_1.jpg'
          grab 23-calbee.jpg 'https://sitem.ssgcdn.com/23/88/06/item/1000633068823_i1_750.jpg'
          grab 24-hadalabo.png 'https://image.oliveyoung.co.kr/cfimages/cf-goods/uploads/images/thumbnails/10/0000/0014/A00000014455128ko.png?l=ko'
          grab 25-biore.jpg 'https://ebay.dykos.com/nexshop/beauty/biore/sunscreen/ar_uv50_watery_essence_70g/001.jpg'
          grab 26-fino.jpg 'https://int.japanesetaste.com/cdn/shop/files/Shiseido-Fino-Premium-Touch-Hair-Mask-230g-1-2024-04-29T02_25_07.450Z.jpg?v=1746161268&width=1500'
          grab 27-bathball.jpg 'https://m.media-amazon.com/images/I/71PwusjKHsL._AC_SL1500_.jpg'
          grab 28-dhc.jpg 'https://megapx-assets.dcard.tw/images/657fafc1-86b2-47b9-8d20-d4f974841262/640.jpeg'
          grab 29-dove.jpg 'https://shimojima.jp/img/goods/Z/2502000046166.jpg' 'https://cloudflare.lipscosme.com/image/2025-09-26-9c546da5fa2bb035458cc99c.png?auto=avif%2Cwebp&fio=1&orient=1&width=430'
          grab 30-donpen.jpg 'https://res.klook.com/image/upload/activities/bcqcvtvyivlgpghq1z2z.jpg'
          grab 31-onsen.jpg 'https://gd.image-qoo10.jp/li/030/572/7953572030.g_600-w-st_g.jpg'
          grab 32-lenor.jpg 'https://tshop.r10s.jp/at-life/cabinet/2021c/4987176098320.jpg?fitin=720%3A720' 'https://i.ebayimg.com/images/g/Q8cAAOSwz-ldB7J~/s-l1200.jpg'
          grab 33-kai.jpg 'https://item-shopping.c.yimg.jp/i/n/benkyoudou_so-yumail-4901601268867' 'https://i.ebayimg.com/images/g/zvMAAOSwjFtm643r/s-l500.png'
          grab 34-gatsby.webp 'https://todokujapan-world.com/cdn/shop/files/100_500x_f03293b5-9569-48ff-89d6-57558c6057ec.webp?v=1698386986&width=2048' 'https://www.komeri.com/images/goods/020/230/09/2023009.jpg'
          grab 35-jonetz.jpg 'https://data.mart-magazine.com/wp-content/uploads/2022/04/21191215/IMG_0515.jpg'

          echo '--- Failed files ---'
          cat assets/donki/products/FAILED.txt
          echo "Successful files: $(find assets/donki/products -type f ! -name FAILED.txt | wc -l)"

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/donki/products
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'Store Donki product images locally'
            git push origin HEAD:main
          fi
