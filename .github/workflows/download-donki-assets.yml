name: Build Donki product assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace Ryukakusan image with validated image file
        shell: bash
        run: |
          set -u
          mkdir -p assets/donki/products
          : > assets/donki/products/FAILED.txt
          rm -f assets/donki/products/04-ryukakusan.jpg

          grab_image() {
            out="$1"; shift
            for url in "$@"; do
              echo "Trying $out <- $url"
              tmp="assets/donki/products/${out}.tmp"
              rm -f "$tmp"
              if curl -fL --retry 2 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0' -e 'https://www.google.com/' "$url" -o "$tmp"; then
                mime=$(file -b --mime-type "$tmp" || true)
                echo "Downloaded MIME: $mime"
                case "$mime" in
                  image/jpeg|image/png|image/webp|image/gif)
                    mv "$tmp" "assets/donki/products/$out"
                    echo "OK $out"
                    return 0
                    ;;
                  *)
                    echo "Rejected non-image response: $mime"
                    rm -f "$tmp"
                    ;;
                esac
              fi
            done
            echo "$out" >> assets/donki/products/FAILED.txt
            echo "FAILED $out"
            return 0
          }

          grab_image 04-ryukakusan.jpg \
            'https://img06.weeecdn.com/item/image/757/249/3CCCDDB0121EF111-square.jpeg' \
            'https://i5.walmartimages.com/asr/7baecb45-3f85-448e-8432-7237db7cfba3.e133c77083a4db0bff7c563ca1a8043d.jpeg' \
            'https://cloudflare.lipscosme.com/image/a4cb419ed8da42d0667ea9e4-1676007909.png?auto=avif%2Cwebp&fio=1&orient=1&width=1200'

          echo '--- Failed files ---'
          cat assets/donki/products/FAILED.txt

      - name: Commit corrected asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/donki/products/04-ryukakusan.jpg assets/donki/products/FAILED.txt
          if git diff --cached --quiet; then
            echo 'No asset changes to commit'
          else
            git commit -m 'Fix Ryukakusan product image'
            git push origin HEAD:main
          fi
